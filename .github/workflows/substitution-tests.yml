name: Substitution Tests

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'lib/substitution-*.ts'
      - 'app/api/employees/available-substitutes/route.ts'
      - 'app/api/substitution/records/route.ts'
      - 'app/dashboard/substitute-assignment/page.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/substitution-tests.yml'
  push:
    branches: [main, develop]
    paths:
      - 'lib/substitution-*.ts'
      - 'app/api/employees/available-substitutes/route.ts'
      - 'app/api/substitution/records/route.ts'
      - 'app/dashboard/substitute-assignment/page.tsx'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/substitution-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  substitution-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run substitution unit tests
        run: npm run test:substitution
